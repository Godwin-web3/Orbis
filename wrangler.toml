name = "orbis-telegram-bot"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Every 1 minute (Workers Cron's minimum granularity): discovery+simulation+prepare
# pass, then an auto-mint attempt pass for opted-in users. This is the serverless
# equivalent of AUTO_MINT_SCAN_INTERVAL_MS / scripts/discovery-bot.ts's
# SCAN_INTERVAL_MS. Faster polling raises RPC request volume against whatever's
# configured in *_RPC_URL — watch for rate-limit errors on free/public endpoints.
[triggers]
crons = ["* * * * *"]

# Secrets (never put these here — set with `wrangler secret put <NAME>`):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_ADMIN_IDS
#   TELEGRAM_WEBHOOK_SECRET      (generate with `openssl rand -hex 32`)
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY    (service_role key — NOT the publishable/anon key)
#   AUTO_MINT_ENCRYPTION_KEY     (optional — enables /autokey; `openssl rand -hex 32`)
#   FLEET_PRIVATE_KEYS           (optional — enables the custodial relay)
#   EXECUTION_PRIVATE_KEY        (optional — operator's own single-key mint path)
#   BATCH_EXECUTOR_ADDRESS       (optional — needed for /mint-all)
#
# Plain config vars (non-secret) go under [vars] below — chain RPC URLs, enabled
# chains, contract lists, policy thresholds, etc. See .env.example for the full list;
# every var read via process.env in src/ works here too once nodejs_compat bridges
# these into process.env (see worker/index.ts's populateProcessEnv).
[vars]
ENABLED_CHAINS = "robinhood,ethereum"
DISCOVERY_MODE = "blocks"
MAX_GAS_NATIVE = "0.005"
MIN_EXPECTED_VALUE_NATIVE = "0"
MAX_MINTS_PER_OPPORTUNITY = "1"
AUTO_MINT_MAX_PER_USER_PER_SCAN = "1"
AUTO_MINT_MAX_TOTAL_PER_SCAN = "10"
# Set these as Runtime variables in the dashboard (Settings > Variables and secrets),
# not here and not in the Build section — see config/chains.ts for the rpcEnv name
# each chain key maps to.
# ROBINHOOD_RPC_URL = "https://your-rpc.example"
# ETHEREUM_RPC_URL = "https://your-rpc.example"
