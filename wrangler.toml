name = "orbis-telegram-bot"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Without this, every `wrangler deploy` treats [vars] below as the FULL authoritative
# set and silently WIPES any plain variable added via the dashboard that isn't listed
# here (secrets are unaffected). This bit us: ETHEREUM_RPC_URL/ROBINHOOD_RPC_URL were
# added via the dashboard and got erased by the next few deploys, leaving discovery
# with no RPC URL to scan and no error to show for it.
keep_vars = true

# Every 1 minute (Workers Cron's minimum granularity): discovery+simulation+prepare
# pass, then an auto-mint attempt pass for opted-in users. This is the serverless
# equivalent of AUTO_MINT_SCAN_INTERVAL_MS / scripts/discovery-bot.ts's
# SCAN_INTERVAL_MS. Faster polling raises RPC request volume against whatever's
# configured in *_RPC_URL — watch for rate-limit errors on free/public endpoints.
[triggers]
crons = ["* * * * *"]

# Secrets (never put these here — set with `wrangler secret put <NAME>`):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_ADMIN_IDS
#   TELEGRAM_WEBHOOK_SECRET      (generate with `openssl rand -hex 32`)
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY    (service_role key — NOT the publishable/anon key)
#   AUTO_MINT_ENCRYPTION_KEY     (optional — enables /autokey; `openssl rand -hex 32`)
#   FLEET_PRIVATE_KEYS           (optional — enables the custodial relay)
#   EXECUTION_PRIVATE_KEY        (optional — operator's own single-key mint path)
#   BATCH_EXECUTOR_ADDRESS       (optional — needed for /mint-all)
#
# Plain config vars (non-secret) go under [vars] below — chain RPC URLs, enabled
# chains, contract lists, policy thresholds, etc. See .env.example for the full list;
# every var read via process.env in src/ works here too once nodejs_compat bridges
# these into process.env (see worker/index.ts's populateProcessEnv).
[vars]
ENABLED_CHAINS = "robinhood,ethereum"
DISCOVERY_MODE = "blocks"
MAX_GAS_NATIVE = "0.005"
MIN_EXPECTED_VALUE_NATIVE = "0"
MAX_MINTS_PER_OPPORTUNITY = "1"
AUTO_MINT_MAX_PER_USER_PER_SCAN = "1"
AUTO_MINT_MAX_TOTAL_PER_SCAN = "10"
# Public, no-signup RPC endpoint as a working default — verified reachable, rate-limited
# under heavy polling. Swap in a dedicated provider by editing this value directly (safe
# from being wiped by a deploy — see keep_vars above).
#
# IMPORTANT: a key declared here is NOT the same as one added via the dashboard's Runtime
# variables — keep_vars only protects UNDECLARED keys from being wiped; a key that's
# declared here gets overwritten back to this committed value on every deploy, even if
# you edited it in the dashboard in between. So don't declare a key here once you're
# managing it via the dashboard instead (e.g. ROBINHOOD_RPC_URL, deliberately left out
# below since it's set via the dashboard to a private provider URL not meant for a public
# repo — see the "Serverless deployment" section of the README).
ETHEREUM_RPC_URL = "https://ethereum-rpc.publicnode.com"
